name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Распаковать zip с проектом
        run: |
          mkdir -p /tmp/proj
          if ls ./*.zip >/dev/null 2>&1; then
            for z in ./*.zip; do unzip -q -o "$z" -d /tmp/proj; done
          else
            cp -r . /tmp/proj
          fi
          DIR=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          echo "PROJ=$DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Сборка
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon
      - name: Переименовать APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/AlteAllNotes.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AlteAllNotes-apk
          path: ${{ runner.temp }}/AlteAllNotes.apk
      - name: Выложить в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Alte All Notes — сборка ${{ github.run_number }}
          files: ${{ runner.temp }}/AlteAllNotes.apk
